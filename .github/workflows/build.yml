name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Tests
        run: npm test

      - name: Publier ou non
        shell: bash
        run: echo "MODE=$([[ '${{ github.ref_type }}' == 'tag' ]] && echo always || echo never)" >> $GITHUB_ENV

      - name: Construire (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:win -- --publish ${{ env.MODE }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run build:mac -- --publish ${{ env.MODE }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux -- --publish ${{ env.MODE }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Récupérer les installeurs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installeurs-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            dist/*.yml
          if-no-files-found: ignore
